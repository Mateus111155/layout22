```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minhas Finanças</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- CABEÇALHO -->

    <header>

        <h1>💰 Minhas Finanças</h1>

        <p>
            Controle seu dinheiro
        </p>

    </header>


    <main>


        <!-- RESUMO -->

        <section class="resumo">


            <div class="card">

                <h2>💰 Saldo</h2>

                <p id="saldo">
                    1000.00
                </p>

            </div>


            <div class="card">

                <h2>📈 Entradas</h2>

                <p id="entradas">
                    0.00
                </p>

            </div>


            <div class="card">

                <h2>📉 Despesas</h2>

                <p id="despesas">
                    0.00
                </p>

            </div>


        </section>


        <!-- ADICIONAR DESPESA -->

        <section class="caixa">

            <h2>➕ Adicionar despesa</h2>


            <label for="descricao">
                Descrição
            </label>


            <input
                type="text"
                id="descricao"
                placeholder="Ex: Mercado"
            >


            <label for="valor">
                Valor
            </label>


            <input
                type="number"
                id="valor"
                placeholder="Ex: 150"
                step="0.01"
            >


            <button
                onclick="adicionarDespesa()"
            >
                Adicionar despesa
            </button>


        </section>


        <!-- LISTA DE DESPESAS -->

        <section class="caixa">

            <h2>📋 Minhas despesas</h2>


            <ul id="lista">

            </ul>


        </section>


    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
```
