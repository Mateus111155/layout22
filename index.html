```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minhas Finanças</title>

</head>

<body>

    <h1>💰 Minhas Finanças</h1>

    <h2>
        Saldo:
        R$ <span id="saldo">1000</span>
    </h2>


    <hr>


    <h2>➕ Adicionar despesa</h2>


    <input
        type="text"
        id="descricao"
        placeholder="Ex: Mercado"
    >


    <br><br>


    <input
        type="number"
        id="valor"
        placeholder="Ex: 150"
    >


    <br><br>


    <button onclick="adicionarDespesa()">
        Adicionar despesa
    </button>


    <h2>📋 Minhas despesas</h2>


    <ul id="lista"></ul>


    <script>

        // Array que guarda as despesas
        let despesas = [];


        // Saldo inicial
        let saldo = 1000;


        function adicionarDespesa() {


            let descricao =
                document.getElementById(
                    "descricao"
                ).value;


            let valor =
                Number(
                    document.getElementById(
                        "valor"
                    ).value
                );


            if (
                descricao === "" ||
                valor <= 0
            ) {

                alert(
                    "Digite uma descrição e um valor."
                );

                return;

            }


            // Criando um objeto
            let novaDespesa = {

                descricao: descricao,

                valor: valor

            };


            // Colocando no array
            despesas.push(
                novaDespesa
            );


            // Diminuindo do saldo
            saldo =
                saldo - valor;


            // Atualizando o saldo
            document.getElementById(
                "saldo"
            ).textContent =
                saldo.toFixed(2);


            // Mostrando a lista
            mostrarDespesas();


            // Limpando os campos
            document.getElementById(
                "descricao"
            ).value = "";


            document.getElementById(
                "valor"
            ).value = "";

        }


        function mostrarDespesas() {


            let lista =
                document.getElementById(
                    "lista"
                );


            // Limpa a lista antes de mostrar
            lista.innerHTML = "";


            despesas.forEach(
                function(despesa) {


                    let item =
                        document.createElement(
                            "li"
                        );


                    item.textContent =
                        despesa.descricao +
                        " - R$ " +
                        despesa.valor.toFixed(2);


                    lista.appendChild(
                        item
                    );

                }
            );

        }

    </script>

</body>

</html>
```
