```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minha Galeria</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header>

        <h1>📸 Minha Galeria</h1>

        <p>Suas fotos em um só lugar</p>

    </header>


    <main>

        <section class="adicionar">

            <h2>Adicionar fotos</h2>

            <input
                type="file"
                id="fotos"
                accept="image/*"
                multiple
            >

        </section>


        <section>

            <h2>Minhas fotos</h2>

            <div
                id="galeria"
                class="galeria"
            ></div>

        </section>

    </main>


    <div
        id="visualizador"
        class="visualizador"
    >

        <button
            onclick="fecharFoto()"
        >
            ✕
        </button>

        <img
            id="fotoGrande"
            src=""
            alt="Foto ampliada"
        >

    </div>


    <script src="script.js"></script>

</body>

</html>
```
