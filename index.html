```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minhas Finanças</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <h1>
            💰 Minhas Finanças
        </h1>

        <p>
            Controle seu dinheiro
        </p>

    </header>



    <main>


        <!-- =========================
             SALDO
        ========================== -->

        <section class="saldo">

            <h2>
                💰 Saldo atual
            </h2>

            <p>

                R$

                <span id="saldo">
                    1000.00
                </span>

            </p>

        </section>



        <!-- =========================
             ENTRADAS
        ========================== -->

        <section class="caixa entrada">

            <h2>
                📈 Adicionar entrada
            </h2>


            <label>
                Descrição
            </label>


            <input
                type="text"
                id="descricaoEntrada"
                placeholder="Ex: Salário"
            >


            <label>
                Valor
            </label>


            <input
                type="number"
                id="valorEntrada"
                placeholder="Ex: 2000"
                step="0.01"
            >


            <button
                onclick="adicionarEntrada()"
            >

                ➕ Adicionar entrada

            </button>

        </section>



        <!-- =========================
             DESPESAS
        ========================== -->

        <section class="caixa despesa">

            <h2>
                📉 Adicionar despesa
            </h2>


            <label>
                Descrição
            </label>


            <input
                type="text"
                id="descricaoDespesa"
                placeholder="Ex: Mercado"
            >


            <label>
                Valor
            </label>


            <input
                type="number"
                id="valorDespesa"
                placeholder="Ex: 150"
                step="0.01"
            >


            <button
                onclick="adicionarDespesa()"
            >

                ➖ Adicionar despesa

            </button>

        </section>



        <!-- =========================
             RESUMO
        ========================== -->

        <section class="resumo">


            <div>

                <h3>
                    📈 Total de entradas
                </h3>

                <p>

                    R$

                    <span id="totalEntradas">
                        0.00
                    </span>

                </p>

            </div>



            <div>

                <h3>
                    📉 Total de despesas
                </h3>

                <p>

                    R$

                    <span id="totalDespesas">
                        0.00
                    </span>

                </p>

            </div>


        </section>



        <!-- =========================
             LISTA DE ENTRADAS
        ========================== -->

        <section class="lista">

            <h2>
                📈 Minhas entradas
            </h2>


            <ul id="listaEntradas">

            </ul>

        </section>



        <!-- =========================
             LISTA DE DESPESAS
        ========================== -->

        <section class="lista">

            <h2>
                📉 Minhas despesas
            </h2>


            <ul id="listaDespesas">

            </ul>

        </section>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        src="script.js"
    ></script>


</body>

</html>
```
