<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Minhas Finanças</title>
</head>

<body>

    <h1>💰 Minhas Finanças</h1>

    <p id="mensagem">Olá!</p>

    <button onclick="mostrarMensagem()">
        Clique aqui
    </button>

    <script>

        function mostrarMensagem() {

            document.getElementById("mensagem").textContent =
                "Meu primeiro JavaScript está funcionando! 🎉";

        }

    </script>

</body>

</html>
