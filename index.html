<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Minha Loja</title>

</head>

<body>

    <!-- CABEÇALHO -->

        <h1>🛍️ Minha Loja</h1>

        <div class="carrinho">

            <span id="quantidade">0</span>
        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <h2>Produtos</h2>


        <!-- PRODUTOS -->
        <section class="produtos">

            <!-- PRODUTO 1 -->
            <div class="produto">

                <h3>Camiseta</h3>

                <p>Uma camiseta confortável e bonita.</p>

                <strong>R$ 50,00</strong>

                <br><br>

                <button onclick="adicionarCarrinho('Camiseta', 50)">
                    Adicionar ao carrinho
                </button>

            </div>


            <!-- PRODUTO 2 -->
            <div class="produto">

                <h3>Calça</h3>

                <p>Calça confortável para o dia a dia.</p>

                <strong>R$ 100,00</strong>

                <br><br>

                <button onclick="adicionarCarrinho('Calça', 100)">
                    Adicionar ao carrinho
                </button>

            </div>


            <!-- PRODUTO 3 -->
            <div class="produto">

                <h3>Tênis</h3>

                <p>Tênis confortável para diversas ocasiões.</p>

                <strong>R$ 200,00</strong>

                <br><br>

                <button onclick="adicionarCarrinho('Tênis', 200)">
                    Adicionar ao carrinho
                </button>

            </div>

        </section>


        <!-- TOTAL -->
        <section class="total">

            <h2>
                Total: R$
                <span id="total">0.00</span>
