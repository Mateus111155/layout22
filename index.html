```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minhas Finanças</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #222;
        }

        header {
            background: #173b2b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        /* RESUMO */

        .resumo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card h3 {
            margin-top: 0;
        }

        .valor {
            font-size: 25px;
            font-weight: bold;
        }

        /* ÁREA PRINCIPAL */

        .area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .caixa {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        /* FORMULÁRIO */

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 16px;
        }

        input,
        select {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #173b2b;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #245c42;
        }

        /* LANÇAMENTOS */

        .lancamento {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .entrada {
            color: green;
            font-weight: bold;
        }

        .despesa {
            color: red;
            font-weight: bold;
        }

        .excluir {
            width: auto;
            background: #d62828;
            padding: 7px 10px;
            margin: 0;
        }

        /* CELULAR */

        @media (max-width: 700px) {

            .resumo {
                grid-template-columns: 1fr;
            }

            .area {
                grid-template-columns: 1fr;
            }

            .lancamento {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .excluir {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>💰 Minhas Finanças</h1>

    <p>Controle seu dinheiro de forma simples</p>

</header>


<main>


    <!-- RESUMO -->

    <section class="resumo">


        <div class="card">

            <h3>Saldo</h3>

            <div class="valor"
                 id="saldo">

                R$ 0,00

            </div>

        </div>


        <div class="card">

            <h3>Entradas</h3>

            <div class="valor"
                 id="entradas">

                R$ 0,00

            </div>

        </div>


        <div class="card">

            <h3>Despesas</h3>

            <div class="valor"
                 id="despesas">

                R$ 0,00

            </div>

        </div>


    </section>


    <!-- FORMULÁRIO E LANÇAMENTOS -->

    <section class="area">


        <!-- ADICIONAR -->

        <div class="caixa">

            <h2>➕ Novo lançamento</h2>


            <input
                type="text"
                id="descricao"
                placeholder="Descrição"
            >


            <input
                type="number"
                id="valor"
                placeholder="Valor"
                step="0.01"
            >


            <select id="tipo">

                <option value="entrada">
                    Entrada
                </option>

                <option value="despesa">
                    Despesa
                </option>

            </select>


            <button onclick="adicionarLancamento()">

                Adicionar lançamento

            </button>


        </div>


        <!-- LISTA -->

        <div class="caixa">

            <h2>📋 Lançamentos</h2>

            <div id="lista">

                <p>
                    Nenhum lançamento ainda.
                </p>

            </div>

        </div>


    </section>


</main>


<script>

    let lancamentos = [];


    function adicionarLancamento() {


        let descricao =
            document.getElementById(
                "descricao"
            ).value;


        let valor =
            parseFloat(
                document.getElementById(
                    "valor"
                ).value
            );


        let tipo =
            document.getElementById(
                "tipo"
            ).value;


        if (
            descricao === "" ||
            isNaN(valor) ||
            valor <= 0
        ) {

            alert(
                "Preencha a descrição e o valor corretamente."
            );

            return;

        }


        lancamentos.push({

            descricao: descricao,

            valor: valor,

            tipo: tipo

        });


        document.getElementById(
            "descricao"
        ).value = "";


        document.getElementById(
            "valor"
        ).value = "";


        atualizar();

    }


    function excluirLancamento(indice) {

        lancamentos.splice(
            indice,
            1
        );

        atualizar();

    }


    function atualizar() {


        let entradas = 0;

        let despesas = 0;


        let lista =
            document.getElementById(
                "lista"
            );


        lista.innerHTML = "";


        if (
            lancamentos.length === 0
        ) {

            lista.innerHTML =
                "<p>Nenhum lançamento ainda.</p>";

        }


        lancamentos.forEach(
            (item, indice) => {


                if (
                    item.tipo === "entrada"
                ) {

                    entradas += item.valor;

                } else {

                    despesas += item.valor;

                }


                let div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "lancamento";


                let classe =
                    item.tipo === "entrada"
                    ? "entrada"
                    : "despesa";


                let sinal =
                    item.tipo === "entrada"
                    ? "+"
                    : "-";


                div.innerHTML = `

                    <div>

                        <strong>
                            ${item.descricao}
                        </strong>

                        <br>

                        <span class="${classe}">

                            ${sinal}
                            R$ ${item.valor
                                .toFixed(2)
                                .replace(".", ",")}

                        </span>

                    </div>


                    <button
                        class="excluir"
                        onclick="excluirLancamento(${indice})"
                    >

                        ❌

                    </button>

                `;


                lista.appendChild(div);

            }
        );


        let saldo =
            entradas - despesas;


        document.getElementById(
            "entradas"
        ).textContent =
            "R$ " +
            entradas
                .toFixed(2)
                .replace(".", ",");


        document.getElementById(
            "despesas"
        ).textContent =
            "R$ " +
            despesas
                .toFixed(2)
                .replace(".", ",");


        document.getElementById(
            "saldo"
        ).textContent =
            "R$ " +
            saldo
                .toFixed(2)
                .replace(".", ",");

    }


</script>


</body>

</html>
```
